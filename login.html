<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Vehicle Rental System</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#667eea,#764ba2);
      padding:20px;
    }

    .login-box{
      width:100%;
      max-width:380px;
      background:#fff;
      padding:30px;
      border-radius:18px;
      box-shadow:0 12px 30px rgba(0,0,0,0.2);
    }

    .login-box h2{
      text-align:center;
      margin-bottom:8px;
      color:#222;
    }

    .subtitle{
      text-align:center;
      color:#666;
      margin-bottom:22px;
      font-size:14px;
    }

    .input-group{
      margin-bottom:15px;
    }

    .input-group label{
      display:block;
      margin-bottom:6px;
      font-size:14px;
      font-weight:bold;
      color:#333;
    }

    .input-group input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:10px;
      outline:none;
      font-size:15px;
    }

    .input-group input:focus{
      border-color:#667eea;
    }

    .login-btn{
      width:100%;
      padding:12px;
      border:none;
      background:#667eea;
      color:#fff;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      margin-top:8px;
    }

    .login-btn:hover{
      background:#5563d6;
    }

    .extra-text{
      text-align:center;
      margin-top:16px;
      font-size:14px;
      color:#555;
    }

    .extra-text a{
      color:#667eea;
      text-decoration:none;
      font-weight:bold;
    }

    .role-note{
      margin-top:18px;
      background:#f3f5ff;
      border-left:4px solid #667eea;
      padding:12px;
      border-radius:10px;
      font-size:13px;
      color:#444;
      line-height:1.5;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login</h2>
    <p class="subtitle">SHAARTHI - Vehicle Rental System</p>

    <div class="input-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username">
    </div>

    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>

    <button class="login-btn" onclick="loginUser()">Login</button>

    <p class="extra-text">
      Don’t have an account? <a href="register.html">Register</a>
    </p>

    <div class="role-note">
      <strong>Owner:</strong> Manage vehicles, see revenue, and view all booking history.<br>
      <strong>User:</strong> Rent or return vehicles and view personal booking history.
    </div>
  </div>

  <script>
  function loginUser(){
    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value.trim();

    if(username === "" || password === ""){
      alert("Please enter username and password");
      return;
    }

    let users = JSON.parse(localStorage.getItem("users")) || [];
    let validUser = users.find(user => user.username === username && user.password === password);

    if(validUser){
      localStorage.setItem("currentUser", JSON.stringify(validUser));

      if(validUser.role === "owner"){
        window.location.href = "owner-dashboard.html";
      } else if(validUser.role === "user"){
        window.location.href = "user-dashboard.html";
      } else {
        alert("Invalid role found for this account");
      }
    } else {
      alert("Invalid username or password");
    }
  }

</script>

</body>
</html>
