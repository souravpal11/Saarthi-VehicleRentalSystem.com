<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }
    body{
      background:linear-gradient(135deg,#667eea,#764ba2);
  color:#222;
  transition:.3s;
    }
    body.dark{
      background:linear-gradient(135deg,#006466,#4d194d);
  color:#fff;
    }
    
     .navbar{
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
  color:white;
  padding:12px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

    .nav-right{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .container{
      width:90%;
      max-width:1200px;
      margin:20px auto;
    }
    .profile-box{
       background:rgba(255,255,255,0.15);
      padding:20px;
      border-radius:15px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      margin-bottom:20px;
    }
    .profile-box p{
      margin:8px 0;
      font-size:15px;
    }
    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:15px;
      margin-bottom:20px;
    }
   
     .card{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(12px);
  padding:25px;
  border-radius:18px;
  text-align:center;
  color:#000000;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  transition:0.3s;
}
    body.dark .card,
    body.dark .vehicle-card,
    body.dark .profile-box{
       background:#0000009e;
      color:#fff;
    }
    button{
      border:none;
      border-radius:8px;
      cursor:pointer;
      color:white;
      padding:10px 14px;
      font-weight:bold;
    }
    .history-btn{ background:linear-gradient(135deg,#4c00ff,#9b377f); color:#fff; }
    .mode-btn{ background:linear-gradient(135deg,#01ff56,#38f9d7); color:#000; }
    .logout-btn{ background:linear-gradient(135deg,#ff416c,#ff4b2b); color:#fff; }
    .rent-btn{ background:#28a745; }
    .return-btn{ background:#ff9800; }
    .delete-profile-btn{ background:#b00020; }

    .vehicle-list{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:20px;
    }
    .vehicle-card{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
  transition:0.3s;
  width: 300px;
}
    .vehicle-card img{
      width:100%;
      height:190px;
      object-fit:cover;
      background:#ddd;
    }
    .vehicle-content{
      padding:15px;
    }
    .vehicle-content p{
      margin:6px 0;
    }
    .role-badge{
      padding:6px 10px;
      border-radius:20px;
      background:linear-gradient(135deg,#434343,#000);
      color:#fff;
      font-size:13px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo" style="display: flex; justify-content: space-between; align-items: center;">
    <img src="LogoS.png" alt="Logo" style="height: 80px; width: 200px;margin-right: 10px;">
    <h2>Dashboard</h2>
    </div>
    <div class="nav-right">
      <span id="userDisplay"></span>
      <span class="role-badge">USER</span>
      <button class="history-btn" onclick="goToHistory()">Booking History</button>
      <button class="mode-btn" onclick="toggleMode()">Dark/Light</button>
      <button class="delete-profile-btn" onclick="deleteProfile()">Delete Profile</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="profile-box">
      <h2 style="margin-bottom:10px;">My Profile</h2>
      <p><strong>Username:</strong> <span id="profileUsername"></span></p>
      <p><strong>Role:</strong> User</p>
      <p><strong>Driving Licence:</strong> <span id="profileLicense"></span></p>
    </div>

    <div class="stats">
      <div class="card">
        <h2 id="totalVehicles">0</h2>
        <p>Total Vehicles</p>
      </div>
      <div class="card">
        <h2 id="rentedVehicles">0</h2>
        <p>Rented Vehicles</p>
      </div>
      <div class="card">
        <h2 id="availableVehicles">0</h2>
        <p>Available Vehicles</p>
      </div>
    </div>

    <div class="vehicle-list" id="vehicleList"></div>
  </div>
  <div class="contact" style="background-color: #000000; color: #fff; text-align: center; padding-top: 15px; height: 50px; ">
    <p>@Saarthi-Vehicle Rental System | Contact Us - Phone No.-8119417520 Or Email ID - souravsir@gmail.com </p>

  </div>

  <script>
    let currentUser = JSON.parse(localStorage.getItem("currentUser"));

    if(!currentUser || currentUser.role !== "user"){
      window.location.href = "index.html";
    }

    document.getElementById("userDisplay").innerText = "👤 " + currentUser.username;
    document.getElementById("profileUsername").innerText = currentUser.username;
    document.getElementById("profileLicense").innerText = currentUser.license || "Not Added";

    let vehicles = JSON.parse(localStorage.getItem("vehicles")) || [];
    let revenue = parseInt(localStorage.getItem("revenue")) || 0;
    let history = JSON.parse(localStorage.getItem("history")) || [];
    let users = JSON.parse(localStorage.getItem("users")) || [];

    function saveData(){
      localStorage.setItem("vehicles", JSON.stringify(vehicles));
      localStorage.setItem("revenue", revenue);
      localStorage.setItem("history", JSON.stringify(history));
      localStorage.setItem("users", JSON.stringify(users));
    }

    function rentVehicle(id){
      let vehicle = vehicles.find(v => v.id === id);

      if(vehicle && vehicle.status === "Available"){
        vehicle.status = "Rented";
        vehicle.rentedBy = currentUser.username;
        revenue += vehicle.price;

        history.push({
          id: Date.now(),
          username: currentUser.username,
          vehicleName: vehicle.name,
          vehicleType: vehicle.type,
          rentPrice: vehicle.price,
          action: "Rented",
          date: new Date().toLocaleString()
        });

        saveData();
        updateDashboard();
      } else {
        alert("Vehicle is already rented");
      }
    }

    function returnVehicle(id){
      let vehicle = vehicles.find(v => v.id === id);

      if(vehicle && vehicle.status === "Rented" && vehicle.rentedBy === currentUser.username){
        history.push({
          id: Date.now(),
          username: currentUser.username,
          vehicleName: vehicle.name,
          vehicleType: vehicle.type,
          rentPrice: vehicle.price,
          action: "Returned",
          date: new Date().toLocaleString()
        });

        vehicle.status = "Available";
        vehicle.rentedBy = "";

        saveData();
        updateDashboard();
      } else {
        alert("You can return only your rented vehicle");
      }
    }

    function deleteProfile(){
      let confirmDelete = confirm("Are you sure you want to delete your profile? This action cannot be undone.");

      if(!confirmDelete){
        return;
      }

      vehicles.forEach(vehicle => {
        if(vehicle.rentedBy === currentUser.username){
          vehicle.status = "Available";
          vehicle.rentedBy = "";
        }
      });

      history = history.filter(item => item.username !== currentUser.username);
      users = users.filter(user => user.username !== currentUser.username);

      saveData();
      localStorage.removeItem("currentUser");

      alert("Your profile has been deleted successfully.");
      window.location.href = "register.html";
    }

    function updateDashboard(){
      let total = vehicles.length;
      let rented = vehicles.filter(v => v.status === "Rented").length;
      let available = vehicles.filter(v => v.status === "Available").length;

      document.getElementById("totalVehicles").innerText = total;
      document.getElementById("rentedVehicles").innerText = rented;
      document.getElementById("availableVehicles").innerText = available;

      renderVehicles();
    }

    function renderVehicles(){
      let vehicleList = document.getElementById("vehicleList");
      vehicleList.innerHTML = "";

      if(vehicles.length === 0){
        vehicleList.innerHTML = "<p>No vehicles available.</p>";
        return;
      }

      vehicles.forEach(vehicle => {
        let button = "";

        if(vehicle.status === "Available"){
          button = `<button class="rent-btn" onclick="rentVehicle(${vehicle.id})">Rent</button>`;
        } else if(vehicle.rentedBy === currentUser.username){
          button = `<button class="return-btn" onclick="returnVehicle(${vehicle.id})">Return</button>`;
        }

        vehicleList.innerHTML += `
          <div class="vehicle-card">
            <img src="${vehicle.image}" alt="${vehicle.name}" onerror="this.src='https://via.placeholder.com/400x190?text=No+Image'">
            <div class="vehicle-content">
              <h3>${vehicle.name}</h3>
              <p><strong>Type:</strong> ${vehicle.type}</p>
              <p><strong>Rent Price:</strong> ₹${vehicle.price}</p>
              <p><strong>Status:</strong> ${vehicle.status}</p>
              ${button}
            </div>
          </div>
        `;
      });
    }

    function goToHistory(){
      window.location.href = "user-history.html";
    }

    function logout(){
      localStorage.removeItem("currentUser");
      window.location.href = "index.html";
    }

    function toggleMode(){
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    }

    if(localStorage.getItem("theme") === "dark"){
      document.body.classList.add("dark");
    }

    updateDashboard();
  </script>
</body>
</html>
