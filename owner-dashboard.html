<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard</title>
  <style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* Background */
body{
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#222;
  transition:.3s;
}

body.dark{
   background:linear-gradient(135deg,#006466,#4d194d);
  color:#fff;
}

/* Navbar */
.navbar{
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
  color:white;
  padding:12px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo h1{
  font-size:22px;
}

/* Right Nav */
.nav-right{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

/* Container */
.container{
  width:90%;
  max-width:1200px;
  margin:25px auto;
}

/* Stats Cards */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-bottom:25px;
}

.card{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(12px);
  padding:25px;
  border-radius:18px;
  text-align:center;
  color:#000000;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px) scale(1.02);
}

/* Buttons */
button{
  border:none;
  border-radius:10px;
  cursor:pointer;
  padding:10px 16px;
  font-weight:600;
  transition:0.3s;
}

.add-btn{ background:linear-gradient(135deg,#00c6ff,#0072ff); color:#fff; }
.history-btn{ background:linear-gradient(135deg,#4c00ff,#9b377f); color:#fff; }
.mode-btn{ background:linear-gradient(135deg,#01ff56,#38f9d7); color:#000; }
.logout-btn{ background:linear-gradient(135deg,#ff416c,#ff4b2b); color:#fff; }
.delete-btn{ background:#e80202af; color:#fff; }
.edit-btn{ background:#ff9e43ab; color:#fff; margin-right:8px; }

button:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 15px rgba(0,0,0,0.3);
}

/* Form Box */
.form-box{
  display:none;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(12px);
  padding:25px;
  border-radius:18px;
  margin-bottom:20px;
}

.form-box input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:10px;
  outline:none;
  background:rgba(255,255,255,0.2);
  color:#000000;
}

/* Vehicle Grid */
.vehicle-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

/* Vehicle Card */
.vehicle-card{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
  transition:0.3s;
  width: 300px;
}

.vehicle-card:hover{
  transform:translateY(-6px) scale(1.02);
}

/* Image */
.vehicle-card img{
  width:100%;
  height:190px;
  object-fit:cover;
}

/* Content */
.vehicle-content{
  padding:15px;
  color:#000000;
}

.vehicle-content h3{
  margin-bottom:8px;
}

.vehicle-content p{
  margin:5px 0;
  font-size:14px;
}

/* Role Badge */
.role-badge{
  padding:6px 12px;
  border-radius:20px;
  background:linear-gradient(135deg,#434343,#000);
  color:#fff;
  font-size:12px;
}

/* Dark mode fixes */
body.dark .card,
body.dark .vehicle-card,
body.dark .vehicle-content,
body.dark .form-box{
  background:#0000009e;
  color:#fff;
}

body.dark .form-box input{
  background:#333333a9;
  color: #ffffff;
}

/* Responsive */
@media(max-width:600px){
  .navbar{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>
<body>
  <div class="navbar">
    <div class="logo" style="display: flex; justify-content: space-between; align-items: center;">
    <img src="LogoS.png" alt="Logo" style="height: 80px; width: 200px;margin-right: 10px;">
    <h2>Dashboard</h2>
    </div>
    <div class="nav-right">
      <span id="userDisplay"></span>
      <span class="role-badge">OWNER</span>
      <button class="add-btn" onclick="openAddForm()">Add Vehicle</button>
      <button class="history-btn" onclick="goToHistory()">Booking History</button>
      <button class="mode-btn" onclick="toggleMode()">Dark/Light</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="stats">
      <div class="card">
        <h2 id="totalVehicles">0</h2>
        <p>Total Vehicles</p>
      </div>
      <div class="card">
        <h2 id="rentedVehicles">0</h2>
        <p>Rented Vehicles</p>
      </div>
      <div class="card">
        <h2 id="availableVehicles">0</h2>
        <p>Available Vehicles</p>
      </div>
      <div class="card">
        <h2 id="totalRevenue">₹0</h2>
        <p>Total Revenue</p>
      </div>
    </div>

    <div class="form-box" id="addVehicleForm">
      <h2 id="formTitle">Add Vehicle</h2>
      <input type="text" id="vehicleName" placeholder="Vehicle Name">
      <input type="text" id="vehicleType" placeholder="Vehicle Type">
      <input type="number" id="vehiclePrice" placeholder="Rent Price">
      <input type="text" id="vehicleImage" placeholder="Vehicle Image URL">
      <button class="add-btn" id="saveVehicleBtn" onclick="saveVehicle()">Save Vehicle</button>
    </div>

    <div class="vehicle-list" id="vehicleList"></div>
  </div>

  <script>
    let currentUser = JSON.parse(localStorage.getItem("currentUser"));

    if(!currentUser || currentUser.role !== "owner"){
      window.location.href = "login.html";
    }

    document.getElementById("userDisplay").innerText = "👤 " + currentUser.username;

    let vehicles = JSON.parse(localStorage.getItem("vehicles")) || [];
    let revenue = parseInt(localStorage.getItem("revenue")) || 0;
    let history = JSON.parse(localStorage.getItem("history")) || [];
    let editVehicleId = null;

    function saveData(){
      localStorage.setItem("vehicles", JSON.stringify(vehicles));
      localStorage.setItem("revenue", revenue);
      localStorage.setItem("history", JSON.stringify(history));
    }

    function openAddForm(){
      editVehicleId = null;
      document.getElementById("formTitle").innerText = "Add Vehicle";
      document.getElementById("saveVehicleBtn").innerText = "Save Vehicle";
      document.getElementById("vehicleName").value = "";
      document.getElementById("vehicleType").value = "";
      document.getElementById("vehiclePrice").value = "";
      document.getElementById("vehicleImage").value = "";
      document.getElementById("addVehicleForm").style.display = "block";
    }

    function saveVehicle(){
      let name = document.getElementById("vehicleName").value.trim();
      let type = document.getElementById("vehicleType").value.trim();
      let price = document.getElementById("vehiclePrice").value.trim();
      let image = document.getElementById("vehicleImage").value.trim();

      if(name === "" || type === "" || price === "" || image === ""){
        alert("Please fill all fields");
        return;
      }

      if(editVehicleId === null){
        vehicles.push({
          id: Date.now(),
          name: name,
          type: type,
          price: Number(price),
          image: image,
          status: "Available",
          rentedBy: ""
        });
      } else {
        let vehicle = vehicles.find(v => v.id === editVehicleId);
        if(vehicle){
          vehicle.name = name;
          vehicle.type = type;
          vehicle.price = Number(price);
          vehicle.image = image;
        }
      }

      saveData();
      updateDashboard();
      document.getElementById("addVehicleForm").style.display = "none";
    }

    function editVehicle(id){
      let vehicle = vehicles.find(v => v.id === id);
      if(!vehicle) return;

      editVehicleId = id;
      document.getElementById("formTitle").innerText = "Edit Vehicle";
      document.getElementById("saveVehicleBtn").innerText = "Update Vehicle";
      document.getElementById("vehicleName").value = vehicle.name;
      document.getElementById("vehicleType").value = vehicle.type;
      document.getElementById("vehiclePrice").value = vehicle.price;
      document.getElementById("vehicleImage").value = vehicle.image;
      document.getElementById("addVehicleForm").style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function deleteVehicle(id){
      vehicles = vehicles.filter(v => v.id !== id);
      saveData();
      updateDashboard();
    }

    function updateDashboard(){
      let total = vehicles.length;
      let rented = vehicles.filter(v => v.status === "Rented").length;
      let available = vehicles.filter(v => v.status === "Available").length;

      document.getElementById("totalVehicles").innerText = total;
      document.getElementById("rentedVehicles").innerText = rented;
      document.getElementById("availableVehicles").innerText = available;
      document.getElementById("totalRevenue").innerText = "₹" + revenue;

      renderVehicles();
    }

    function renderVehicles(){
      let vehicleList = document.getElementById("vehicleList");
      vehicleList.innerHTML = "";

      if(vehicles.length === 0){
        vehicleList.innerHTML = "<p>No vehicles added yet.</p>";
        return;
      }

      vehicles.forEach(vehicle => {
        vehicleList.innerHTML += `
          <div class="vehicle-card">
            <img src="${vehicle.image}" alt="${vehicle.name}" onerror="this.src='https://via.placeholder.com/400x190?text=No+Image'">
            <div class="vehicle-content">
              <h3>${vehicle.name}</h3>
              <p><strong>Type:</strong> ${vehicle.type}</p>
              <p><strong>Rent Price:</strong> ₹${vehicle.price}</p>
              <p><strong>Status:</strong> ${vehicle.status}</p>
              <p><strong>Rented By:</strong> ${vehicle.rentedBy || "None"}</p>
              <button class="edit-btn" onclick="editVehicle(${vehicle.id})">Edit</button>
              <button class="delete-btn" onclick="deleteVehicle(${vehicle.id})">Delete</button>
            </div>
          </div>
        `;
      });
    }

    function goToHistory(){
      window.location.href = "owner-history.html";
    }

    function logout(){
      localStorage.removeItem("currentUser");
      window.location.href = "login.html";
    }

    function toggleMode(){
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    }

    if(localStorage.getItem("theme") === "dark"){
      document.body.classList.add("dark");
    }

    updateDashboard();
  </script>
</body>
</html>
